# Kotost Skill Tree («Древо умений»): a port of Passive Skill Tree 0.6.14a (Daripher, GPL-3.0) to Horizon.
# The server keeps the points, the learned skills and their bonuses; the client draws the tree (O, /skilltree).
# The tree, its texts and pictures are the original's data files, baked into data/ (kotost_skilltree_tools/bake.py).
# Native mod for Horizon nightly-2026-11-08-fdc87ae (docs/native-mods.md, horizon-mixins).
[mod]
id = "kotost_skilltree"
version = "0.2.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "kotost_skilltree"
source = "skilltree.rs"
visibility = "pub"

# --- server ------------------------------------------------------------------------------------------
[[injection]]
id = "commands"
kind = "HEAD"
hook = "register_commands"
hook_version = 1
helper = "hooks/commands.rs"
bindings = [{ name = "commands", ty = "&mut Vec<NativeCommand>", value = "&mut *commands" }]

[[injection]]
id = "command"
kind = "HEAD"
hook = "perform_command"
hook_version = 1
helper = "hooks/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "net-from-client"
kind = "HEAD"
hook = "net_from_client"
hook_version = 1
helper = "hooks/net_client.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "joined"
kind = "HEAD"
hook = "player_logged_in"
hook_version = 1
helper = "hooks/joined.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

[[injection]]
id = "respawned"
kind = "HEAD"
hook = "player_respawned"
hook_version = 1
helper = "hooks/respawned.rs"
bindings = [{ name = "player", ty = "u128", value = "player" }]

# A player's melee hit on a mob: damage and critical hit bonuses.
[[injection]]
id = "melee"
kind = "HEAD"
hook = "living_incoming_damage_v2"
hook_version = 1
helper = "hooks/melee.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
]

# Every other hit: a player's projectiles and magic, evasion and blocking of a hit on a player.
[[injection]]
id = "incoming"
kind = "HEAD"
hook = "living_incoming_damage"
hook_version = 1
helper = "hooks/incoming.rs"
bindings = [
  { name = "entity", ty = "i32", value = "entity" },
  { name = "damage_type", ty = "&str", value = "damage_type" },
  { name = "causing", ty = "i32", value = "causing" },
  { name = "direct", ty = "i32", value = "direct" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Both sides: the server's asks and bonuses, the window's messages.
[[injection]]
id = "tick"
kind = "HEAD"
hook = "tick"
hook_version = 1
helper = "hooks/tick.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

# --- client: the screen ------------------------------------------------------------------------------
[[injection]]
id = "key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "hooks/key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "net-from-server"
kind = "HEAD"
hook = "net_from_server"
hook_version = 1
helper = "hooks/net_server.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "render"
kind = "HEAD"
hook = "screen_render_post"
hook_version = 1
helper = "hooks/render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "batch", ty = "&mut HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
]

[[injection]]
id = "press"
kind = "HEAD"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
helper = "hooks/press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "release"
kind = "HEAD"
hook = "screen_mouse_button_released_pre"
hook_version = 1
helper = "hooks/release.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "scroll"
kind = "HEAD"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
helper = "hooks/scroll.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen-key"
kind = "HEAD"
hook = "screen_key_pressed_pre"
hook_version = 1
helper = "hooks/screen_key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "screen", ty = "&NativeScreenView<'_>", value = "screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# --- gems (0.2.0) ------------------------------------------------------------------------------------
# A gem now and then from an ore a player broke without Silk Touch.
[[injection]]
id = "loot-drops"
kind = "HEAD"
hook = "loot_drops"
hook_version = 1
helper = "hooks/loot_drops.rs"
bindings = [
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "&mut *drops" },
]

# A gem's bonuses, an item's sockets and gems, in its tooltip.
[[injection]]
id = "tooltip"
kind = "HEAD"
hook = "tooltip"
hook_version = 1
helper = "hooks/tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

# An item and a gem on an anvil: the gem goes into a socket (the catalog of this revision lacks the name).
[[injection]]
id = "anvil"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_anvil_update"
helper = "hooks/anvil.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
  { name = "left", ty = "&horizon_client::items::ItemStack", value = "left" },
  { name = "right", ty = "Option<&horizon_client::items::ItemStack>", value = "right" },
  { name = "output", ty = "&mut Option<horizon_client::items::ItemStack>", value = "&mut *output" },
  { name = "xp_cost", ty = "&mut i32", value = "&mut *xp_cost" },
  { name = "material_cost", ty = "&mut i32", value = "&mut *material_cost" },
]

# The server's work (points, skills, attribute modifiers, gems) at the end of each server tick.
[[injection]]
id = "server-tick"
kind = "HEAD"
hook = "server_tick"
hook_version = 1
helper = "hooks/server_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "horizon_client::mod_api::ServerTickPhase", value = "phase" },
]
